name: manager
description: "Track Fleet"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 3.18.8+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0
  flutter_map_cancellable_tile_provider: ^3.0.0
  flutter_svg: ^2.0.0
  shared_preferences: ^2.3.3
  http: ^1.2.2
  web_socket_channel: ^3.0.3
  crypto: ^3.0.6
  web: ^1.1.1
  url_launcher: ^6.3.1
  font_awesome_flutter: ^10.8.0
  share_plus: ^12.0.1
  firebase_core: ^4.2.1
  firebase_crashlytics: ^5.0.5
  firebase_messaging: ^16.0.4
  package_info_plus: ^8.1.3
  webview_flutter: ^4.13.0
  flutter_inappwebview: ^6.1.5
  local_auth: ^2.3.0
  in_app_update: ^4.2.3
  csv: ^8.0.0
  pdf: ^3.12.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/marker.png
    - assets/app_icon.png
  fonts:
    - family: platform-font
      fonts:
        - asset: assets/fonts/icons.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
